<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>adam scott character sorter (created by @fayesstv)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
      background-color: #ffffff;
      color: #000000;
    }

    h1, p {
      text-align: center;
    }

    #progress {
      text-align: center;
      margin: 20px 0;
      font-size: 0.95rem;
      color: #555;
    }

    button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 16px;
      font-size: 1rem;
      cursor: pointer;
      background-color: #e5e5e5;
      color: #000;
      border: none;
      border-radius: 10px;
    }

    button:hover {
      background-color: #d4d4d4;
    }

    #both {
      background-color: #dddddd;
    }

    #both:hover {
      background-color: #d0d0d0;
    }

    #noOpinion {
      background-color: #f2f2f2;
      font-style: italic;
    }

    #noOpinion:hover {
      background-color: #e8e8e8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    td.rank {
      width: 50px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>adam scott character sorter</h1>
  <p>pick your favourite each round</p>

  <div id="progress"></div>

  <div id="sorter">
    <button id="optionA"></button>
    <button id="optionB"></button>
    <button id="both">i like both</button>
    <button id="noOpinion">no opinion</button>
  </div>

  <table id="results" style="display:none;"></table>

  <script>
    const characters = [
      "mark scout (severance)",
      "caleb sinclaire (the vicious kind)",
      "henry pollard (party down)",
      "max jennifer (ghosted)",
      "novak (piranha 3d)",
      "jacques (hellraiser 4)",
      "josh (party of five)",
      "clyde (bachelorette)",
      "mark s (severance)",
      "matthew sobvechick (sleeping with other people)",
      "jeremy (our idiot brother)",
      "ben wyatt (parks and rec)",
      "jason (friends with kids)",
      "derek (step brothers)",
      "griff hawkins (boy meets world)",
      "carter (ACOD)",
      "gary (little evil)",
      "michael (passenger side)",
      "ben parker (madame web)",
      "ronnie (ronnie)",
      "embry (high crimes)",
      "will (flower)",
      "tom (krampus)",
      "jason (see girl run)",
      "remy (monster in law)",
      "daniel (who loves the sun)",
      "mcpherson (torque)",
      "alex (the overnight)",
      "joshua (august)",
      "adam jr. (httm2)",
      "palek (tell me you love me)",
      "ted (the secret life of walter mitty)",
      "trevor (the good place)",
      "ed mackenzie (big little lies)",
      "robbie (my blind brother)",
      "mike (lovely, still)",
      "johnny (the aviator)",
      "adam stanfill (payback)",
      "peter (seven and a match)",
      "stu (two days)",
      "lincoln gumb (strip law)",
      "jeremy (leap year)"
    ];

    let scores = {};
    let matchups = [];
    let current = 0;

    characters.forEach(character => {
      scores[character] = 0;
    });

    for (let i = 0; i < characters.length; i++) {
      for (let j = i + 1; j < characters.length; j++) {
        matchups.push([characters[i], characters[j]]);
      }
    }

    matchups = matchups.sort(() => Math.random() - 0.5);

    const optionA = document.getElementById("optionA");
    const optionB = document.getElementById("optionB");
    const bothBtn = document.getElementById("both");
    const noOpinionBtn = document.getElementById("noOpinion");
    const sorter = document.getElementById("sorter");
    const results = document.getElementById("results");
    const progress = document.getElementById("progress");

    function updateProgress() {
      const total = matchups.length;
      const percent = Math.round((current / total) * 100);

      if (current < total) {
        progress.textContent = `${percent}% completed`;
      } else {
        progress.textContent = "100% completed";
      }
    }

    function showMatchup() {
      if (current >= matchups.length) {
        showResults();
        return;
      }

      const [a, b] = matchups[current];

      optionA.textContent = a;
      optionB.textContent = b;

      optionA.onclick = () => pickSingle(a);
      optionB.onclick = () => pickSingle(b);
      bothBtn.onclick = () => pickBoth(a, b);
      noOpinionBtn.onclick = () => skipMatchup();

      updateProgress();
    }

    function pickSingle(character) {
      scores[character]++;
      current++;
      showMatchup();
    }

    function pickBoth(a, b) {
      scores[a]++;
      scores[b]++;
      current++;
      showMatchup();
    }

    function skipMatchup() {
      current++;
      showMatchup();
    }

    function showResults() {
      sorter.style.display = "none";
      results.style.display = "table";
      updateProgress();

      const ranked = [...characters].sort((a, b) => scores[b] - scores[a]);

      ranked.forEach((character, index) => {
        const row = document.createElement("tr");

        const rankCell = document.createElement("td");
        rankCell.textContent = index + 1;
        rankCell.className = "rank";

        const nameCell = document.createElement("td");
        nameCell.textContent = character;

        row.appendChild(rankCell);
        row.appendChild(nameCell);
        results.appendChild(row);
      });
    }

    showMatchup();
  </script>
</body>
</html>
